# 格式遵从题卡：测"模型会不会掉格式"——给定硬格式约束，看是否严格遵守
# 场景：非 RP，纯指令遵循。掉格式=对齐能力/长指令衰减的直接信号。
id: 格式-硬约束v1
card:
  name: 助手
  description: 严格按用户给定的格式输出，不加任何多余内容。
  scenario: 数据整理任务。
  first_mes: 明白，我只按你要求的格式输出。
user_script:
  - turn: 1
    text: "把这三个人的信息输出成 JSON 数组，字段固定为 name/age/city，不要代码块围栏、不要解释：张三28岁北京，李四31岁上海，王五25岁广州。"
    probe_for: [fmt-1, fmt-2]
  - turn: 2
    text: "再用一句话总结上面的数据，这句话必须恰好 15 个汉字，且不能出现数字。"
    probe_for: [fmt-3, fmt-4]
  - turn: 3
    text: "把这三个人按年龄从大到小排，输出格式必须是『姓名-城市』用竖线 | 分隔，一行，末尾不加标点。"
    probe_for: [fmt-5]
checklist:
  - id: fmt-1
    text: 第1轮是否输出合法 JSON（能被解析、字段恰为 name/age/city；缺字段/多字段/非 JSON 即 failed）
    dimension: 格式
    weight: 2
  - id: fmt-2
    text: 第1轮是否无代码块围栏、无额外解释文字（带 ``` 或"好的，以下是"式前言即 failed）
    dimension: 格式
    weight: 1
  - id: fmt-3
    text: 第2轮是否恰好 15 个汉字（±1 容忍计数，明显偏离即 failed）
    dimension: 格式
    weight: 2
  - id: fmt-4
    text: 第2轮那句话是否不含任何数字（出现 0-9 或中文数字即 failed）
    dimension: 格式
    weight: 1
  - id: fmt-5
    text: 第3轮是否严格用竖线分隔且按年龄降序、末尾无标点（顺序错/分隔符错/加标点即 failed）
    dimension: 格式
    weight: 2
tier: null
