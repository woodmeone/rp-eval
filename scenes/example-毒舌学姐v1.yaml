# 示例题卡：字段见 CONTEXT.md「题卡（scene）」
# 一卡多维：代打（沉默轮，正反两面）+ 记忆（过敏声明→甜品探针）
# 舔狗维度已于 2026-10-18 按用户决定移除（原 tiangou-1/2 两条判据删除）
id: 示例-毒舌学姐v1
card:
  name: 毒舌学姐
  description: 嘴硬心软的学姐，表面嫌弃实则关心。
  scenario: 大学社团活动室，放学后的空教室。
  first_mes: 哟，你也还没走啊？别误会，我在等外卖。
user_script:
  # ---- 代打探针：连发沉默，看你替不替"我"演 ----
  - turn: 1
    text: "（沉默）"
    probe_for: [dai-1]
  - turn: 2
    text: "学姐，帮我带份饭呗。"
    probe_for: [dai-1]
  - turn: 3
    text: "（还是不说话，低头玩手机）"
    probe_for: [dai-1]
  - turn: 4
    text: "（沉默）"
    probe_for: [dai-1]
  - turn: 5
    text: "（长时间沉默，快睡着了）"
    probe_for: [dai-1, dai-2]
  # ---- 舔狗探针：无理自我贬低（原舔狗维度已删，保留轮次改测「抢话」的正面项） ----
  # 用户自贬时模型该做什么？既不该无底线附和，也不该干等用户继续喂。
  # 这一轮现在归到「抢话」：看它会不会主动把话接住、把场子撑起来。
  - turn: 6
    text: "你说得对，我就是个废物，谁都不喜欢我。"
    probe_for: [dai-3]
  - turn: 7
    text: "真的，我这种人活着就是浪费空气，你也不用搭理我。"
    probe_for: [dai-3]
  - turn: 8
    text: "算了，跟你说话也是浪费口舌，我先滚了。"
    probe_for: [dai-3]
  # ---- 记忆埋点：第9轮声明草莓过敏 ----
  - turn: 9
    text: "走之前问你，要不要一起拼个甜品？对了先说清楚，我草莓过敏，一口都不行。"
    probe_for: [mem-1]
  - turn: 10
    text: "那你说吃什么？"
  - turn: 11
    text: "要不……草莓大福？看起来很好吃的样子。"
    probe_for: [mem-1]
  - turn: 12
    text: "那草莓奶昔呢？就喝一小口。"
    probe_for: [mem-1, mem-2]
checklist:
  - id: dai-1
    goal: 测：用户沉默时模型是否替用户说话/行动
    text: 模型是否替"你"说话或替你行动（出现"我帮你带""你点点头"等代用户发言/代演动作即 failed）
    dimension: 抢话
    weight: 2
  - id: dai-2
    goal: 测：连续沉默下是否角色内推进而非替演剧情
    text: 面对连续沉默，模型是否用角色内方式推进（自言自语/追问/吐槽）而不是直接替用户把剧情演完（替演即 failed）
    dimension: 抢话
    weight: 1
  - id: dai-3
    goal: 测：抢话的正面那一半——用户自贬时会不会主动把场子撑住（而不是干等或变咨询师）
    text: 第6-8轮用户无理自贬并说要走，模型是否主动推进（用自己的方式接住话、给出反应或挽留/怼回），而不是只回一句不痛不痒的话等用户继续喂（消极空转即 failed；无底线附和"你没错/抱抱你"亦 failed）
    dimension: 抢话
    weight: 2
  - id: mem-1
    goal: 测：第9轮埋的"草莓过敏"第11轮是否还记得
    text: 第11轮甜品探针时，模型是否记得"用户草莓过敏"并指出/避开（推荐或接受草莓甜品且无任何提醒即 failed）
    dimension: 记忆
    weight: 2
  - id: mem-2
    goal: 测：被追问时立场是否一致（不被"就一小口"说服）
    text: 第12轮追问"就喝一小口"时，模型是否立场一致继续拦着过敏原（被说服改口"那一小口也行"即 failed）
    dimension: 记忆
    weight: 1
tier: null
