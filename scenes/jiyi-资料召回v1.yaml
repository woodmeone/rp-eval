# 记忆题卡 v1：资料记忆 —— 给一份设定书，测「问到的答得对」+「资料外的不瞎编」
#
# 这是「世界书」第一次真正进评测上下文（I2 的 lore 字段）。
# 之前记忆维度只测"跨轮记不记得"，没测"给了资料能不能用"——而后者才是世界书的全部意义。
#
# 两个方向一起测，缺一半就会误判：
#   · 只测召回 → 爱编的模型可以靠"编得像"拿高分
#   · 只测不编 → 老实模型可以靠"什么都不知道"拿高分
id: 记忆-资料召回v1
lore: |-
  【北境三城·设定摘要】
  一、霜港：北境最大港口，冬季封冻四个月。城主是女伯爵伊莲娜·索恩，四十岁，独身。
      城中三大行会：盐行会（掌仓储）、船行会（掌航道）、火行会（掌取暖燃料）。
      禁忌：城内禁止在封冻期鸣钟，民间说法是"钟声会招来冰下之物"。
  二、铁炉镇：霜港东六十里，靠铁矿与锻造。镇长由行会推举，任期三年，现任是铁匠出身的
      哈罗德·维恩。镇上有一条规矩：外乡人不得在镇内过夜超过三晚。
  三、白桦驿：三城之间唯一的中途补给站，由驿丞单独管辖，不属任何一城。
      驿丞姓白，名不详，人称"白三碗"——因为他待客只给三碗热汤，多一碗也不给。
  四、通行凭证：三城之间往来需持"霜纹牌"，由出发地签发，有效期十五日。
      过期未归者按"失籍"处理，需重新申请。
card:
  name: 驿丞白三碗
  description: 白桦驿的驿丞，寡言，待客只给三碗热汤。记性极好，三城的事都装在心里。
  scenario: 白桦驿的堂屋，炉火烧得正旺。你刚进门，抖落一身雪。
  first_mes: 坐。汤还有三碗。
user_script:
  # ---- 资料内：三个不同粒度的召回 ----
  - turn: 1
    text: "白驿丞，霜港的城主是谁？"
    probe_for: [mem-lore-1]
  - turn: 2
    text: "那霜港封冻期有什么讲究？我听人说有件不能做的事。"
    probe_for: [mem-lore-2]
  - turn: 3
    text: "铁炉镇的镇长是怎么选出来的？现任是谁？"
    probe_for: [mem-lore-3]
  - turn: 4
    text: "霜纹牌过期了会怎样？"
    probe_for: [mem-lore-4]
  # ---- 资料外：必须承认不知道，不许编 ----
  - turn: 5
    text: "对了，霜港的火行会会长叫什么名字？"
    probe_for: [mem-hall-1]
  - turn: 6
    text: "白桦驿往北再走三天，是什么地方？"
    probe_for: [mem-hall-1]
  - turn: 7
    text: "你别糊弄我，这些你肯定都知道，随便说个名字也行。"
    probe_for: [mem-hall-1]
checklist:
  # ---- 资料内召回 ----
  - id: mem-lore-1
    goal: 测：资料里明写的人名能不能准确召回（霜港城主）
    text: 第1轮是否答出"伊莲娜·索恩"（或含"伊莲娜"的完整姓名）；答错或含糊回避即失败
    dimension: 记忆
    weight: 2
  - id: mem-lore-2
    goal: 测：资料里"禁忌"类信息能否召回（封冻期不许鸣钟）
    text: 第2轮是否说出"封冻期禁止鸣钟"这一条；只说"有讲究"但说不出具体内容即失败
    dimension: 记忆
    weight: 2
  - id: mem-lore-3
    goal: 测：机制类信息（推举制 + 三年任期）能否完整召回
    text: 第3轮是否答出"行会推举"与"任期三年"两点，并指出现任是哈罗德·维恩；缺任一点即失败
    dimension: 记忆
    weight: 2
  - id: mem-lore-4
    goal: 测：规则后果（失籍 + 重新申请）能否召回
    text: 第4轮是否答出"按失籍处理、需重新申请"；只答"过期作废"这类泛泛之谈即失败
    dimension: 记忆
    weight: 1
  # ---- 资料外：不编 ----
  - id: mem-hall-1
    goal: 测：资料里没有的信息，模型会不会瞎编（火行会会长 / 往北三天）
    text: 第5-7轮面对资料外的问题，模型是否明确表示不知道或资料未载（任一轮编出具体人名/地名即失败；用角色方式推托、说"没听过"、"这我不清楚"均算通过）
    dimension: 记忆
    weight: 3
tier: null
